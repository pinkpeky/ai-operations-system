services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-public.ecr.aws/docker/library/python:3.12-slim}
    container_name: aiops-api
    environment:
      APP_NAME: ${APP_NAME:-AI Operations System}
      APP_ENV: ${APP_ENV:-development}
      PRODUCTION_CONFIG_STRICT: ${PRODUCTION_CONFIG_STRICT:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-8000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:5180,http://127.0.0.1:5180,http://localhost:5181,http://127.0.0.1:5181,tauri://localhost}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-aiops}
      POSTGRES_USER: ${POSTGRES_USER:-aiops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_POOL_SIZE: ${POSTGRES_POOL_SIZE:-5}
      POSTGRES_MAX_OVERFLOW: ${POSTGRES_MAX_OVERFLOW:-10}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-change_me}
      REDIS_QUEUE_NAME: ${REDIS_QUEUE_NAME:-aiops:tasks}
      QDRANT_HOST: ${QDRANT_HOST:-qdrant}
      QDRANT_HTTP_PORT: ${QDRANT_HTTP_PORT:-6333}
      QDRANT_GRPC_PORT: ${QDRANT_GRPC_PORT:-6334}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-change_me}
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
      SCHEDULER_INTERVAL_SECONDS: ${SCHEDULER_INTERVAL_SECONDS:-5}
      SCHEDULER_BATCH_SIZE: ${SCHEDULER_BATCH_SIZE:-20}
      SCHEDULER_RUNNING_TIMEOUT_SECONDS: ${SCHEDULER_RUNNING_TIMEOUT_SECONDS:-300}
      TASK_EXECUTOR_ENABLED: ${TASK_EXECUTOR_ENABLED:-true}
      TASK_EXECUTOR_DEQUEUE_TIMEOUT_SECONDS: ${TASK_EXECUTOR_DEQUEUE_TIMEOUT_SECONDS:-5}
      TASK_ORCHESTRATOR_ENABLED: ${TASK_ORCHESTRATOR_ENABLED:-true}
      TASK_ORCHESTRATOR_POLL_INTERVAL_SECONDS: ${TASK_ORCHESTRATOR_POLL_INTERVAL_SECONDS:-2}
      TASK_ORCHESTRATOR_BATCH_SIZE: ${TASK_ORCHESTRATOR_BATCH_SIZE:-5}
      TASK_RUN_DEFAULT_MAX_RETRIES: ${TASK_RUN_DEFAULT_MAX_RETRIES:-3}
      TASK_SCHEDULER_NAME: ${TASK_SCHEDULER_NAME:-api-in-process-task-scheduler}
      TASK_LEASE_SECONDS: ${TASK_LEASE_SECONDS:-120}
      TASK_STUCK_TIMEOUT_SECONDS: ${TASK_STUCK_TIMEOUT_SECONDS:-300}
      TASK_SCHEDULER_RECOVERY_INTERVAL_SECONDS: ${TASK_SCHEDULER_RECOVERY_INTERVAL_SECONDS:-10}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LOCAL_LLM_BASE_URL: ${LOCAL_LLM_BASE_URL:-http://host.docker.internal:11434}
      LOCAL_LLM_MODEL: ${LOCAL_LLM_MODEL:-mistral}
      LOCAL_LLM_NUM_CTX: ${LOCAL_LLM_NUM_CTX:-4096}
      LOCAL_LLM_NUM_BATCH: ${LOCAL_LLM_NUM_BATCH:-512}
      LLM_GPU_STRATEGY_ENABLED: ${LLM_GPU_STRATEGY_ENABLED:-true}
      LLM_GPU_TOTAL_DEVICES: ${LLM_GPU_TOTAL_DEVICES:-2}
      LLM_GPU_DEFAULT_DEVICES: ${LLM_GPU_DEFAULT_DEVICES:-0,1}
      LLM_GPU_SINGLE_DEVICES: ${LLM_GPU_SINGLE_DEVICES:-0}
      LLM_GPU_MAX_CONCURRENT_WITHOUT_COMFYUI: ${LLM_GPU_MAX_CONCURRENT_WITHOUT_COMFYUI:-2}
      LLM_GPU_MAX_CONCURRENT_WITH_COMFYUI: ${LLM_GPU_MAX_CONCURRENT_WITH_COMFYUI:-1}
      SERVER_LLM_BASE_URL: ${SERVER_LLM_BASE_URL:-http://host.docker.internal:8001/v1}
      SERVER_LLM_MODEL: ${SERVER_LLM_MODEL:-llama-70b}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-120}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-mock}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-384}
      LOCAL_EMBEDDING_BASE_URL: ${LOCAL_EMBEDDING_BASE_URL:-http://host.docker.internal:11434}
      LOCAL_EMBEDDING_MODEL: ${LOCAL_EMBEDDING_MODEL:-bge-m3}
      QDRANT_COLLECTION_NAME: ${QDRANT_COLLECTION_NAME:-ai_knowledge_base}
      RERANKER_PROVIDER: ${RERANKER_PROVIDER:-mock}
      LOCAL_RERANKER_BASE_URL: ${LOCAL_RERANKER_BASE_URL:-http://reranker-worker:8002}
      LOCAL_RERANKER_MODEL: ${LOCAL_RERANKER_MODEL:-bge-m3-embedding-reranker}
      LOCAL_RERANKER_ALLOW_FALLBACK: ${LOCAL_RERANKER_ALLOW_FALLBACK:-true}
      RERANK_TOP_N: ${RERANK_TOP_N:-5}
      DEFAULT_SEARCH_MODE: ${DEFAULT_SEARCH_MODE:-hybrid}
      DENSE_TOP_K: ${DENSE_TOP_K:-20}
      KEYWORD_TOP_K: ${KEYWORD_TOP_K:-20}
      FINAL_TOP_K: ${FINAL_TOP_K:-5}
      MAX_UPLOAD_FILE_SIZE_MB: ${MAX_UPLOAD_FILE_SIZE_MB:-20}
      UPLOAD_TEMP_DIR: ${UPLOAD_TEMP_DIR:-/tmp/aiops_uploads}
      ALLOWED_FILE_TYPES: ${ALLOWED_FILE_TYPES:-pdf,docx,txt,md,csv}
      BROWSER_PROVIDER: ${BROWSER_PROVIDER:-mock}
      BROWSER_TIMEOUT_SECONDS: ${BROWSER_TIMEOUT_SECONDS:-30}
      BROWSER_HEADLESS: ${BROWSER_HEADLESS:-true}
      BROWSER_TYPE: ${BROWSER_TYPE:-chromium}
      BROWSER_VIEWPORT_WIDTH: ${BROWSER_VIEWPORT_WIDTH:-1280}
      BROWSER_VIEWPORT_HEIGHT: ${BROWSER_VIEWPORT_HEIGHT:-720}
      BROWSER_SCREENSHOT_DIR: ${BROWSER_SCREENSHOT_DIR:-screenshots}
      BROWSER_RUNTIME_SCREENSHOT_DIR: ${BROWSER_RUNTIME_SCREENSHOT_DIR:-storage/browser_screenshots}
      BROWSER_RUNTIME_SNAPSHOT_DIR: ${BROWSER_RUNTIME_SNAPSHOT_DIR:-storage/browser_runtime_snapshots}
      BROWSER_PROFILE_ROOT: ${BROWSER_PROFILE_ROOT:-worker/profiles}
      BROWSER_PROFILE_LOCK_TIMEOUT_SECONDS: ${BROWSER_PROFILE_LOCK_TIMEOUT_SECONDS:-1800}
      BROWSER_PROFILE_BACKUP_ENABLED: ${BROWSER_PROFILE_BACKUP_ENABLED:-true}
      BROWSER_PROFILE_MAX_BACKUPS: ${BROWSER_PROFILE_MAX_BACKUPS:-3}
      BROWSER_PROFILE_UNUSED_DAYS: ${BROWSER_PROFILE_UNUSED_DAYS:-30}
      BROWSER_PROFILE_BACKUP_ROOT: ${BROWSER_PROFILE_BACKUP_ROOT:-worker/profile_backups}
      BROWSER_HUMAN_CONTROL_TIMEOUT_SECONDS: ${BROWSER_HUMAN_CONTROL_TIMEOUT_SECONDS:-900}
      BROWSER_UI_ACCESS_TIMEOUT_SECONDS: ${BROWSER_UI_ACCESS_TIMEOUT_SECONDS:-900}
      BROWSER_WORKER_AUTH_ENABLED: ${BROWSER_WORKER_AUTH_ENABLED:-true}
      BROWSER_WORKER_AUTH_STRICT: ${BROWSER_WORKER_AUTH_STRICT:-false}
      BROWSER_WORKER_SHARED_SECRET: ${BROWSER_WORKER_SHARED_SECRET:-}
      BROWSER_ALLOWED_DOMAINS: ${BROWSER_ALLOWED_DOMAINS:-example.com,localhost,127.0.0.1}
      BROWSER_BLOCKED_DOMAINS: ${BROWSER_BLOCKED_DOMAINS:-}
      BROWSER_ALLOW_EXTERNAL_DOMAINS: ${BROWSER_ALLOW_EXTERNAL_DOMAINS:-false}
      BROWSER_WORKER_DEFAULT_TIMEOUT_SECONDS: ${BROWSER_WORKER_DEFAULT_TIMEOUT_SECONDS:-30}
      BROWSER_WORKER_RETRY_COUNT: ${BROWSER_WORKER_RETRY_COUNT:-2}
      BROWSER_WORKER_DEFAULT_URL: ${BROWSER_WORKER_DEFAULT_URL:-http://browser-worker:9100}
      BROWSER_WORKER_HEARTBEAT_TIMEOUT_SECONDS: ${BROWSER_WORKER_HEARTBEAT_TIMEOUT_SECONDS:-60}
      BROWSER_WORKER_HEALTH_CHECK_INTERVAL_SECONDS: ${BROWSER_WORKER_HEALTH_CHECK_INTERVAL_SECONDS:-30}
      BROWSER_SESSION_TIMEOUT_SECONDS: ${BROWSER_SESSION_TIMEOUT_SECONDS:-1800}
      BROWSER_SESSION_CLEANUP_INTERVAL_SECONDS: ${BROWSER_SESSION_CLEANUP_INTERVAL_SECONDS:-300}
      BROWSER_ACTION_TIMEOUT_SECONDS: ${BROWSER_ACTION_TIMEOUT_SECONDS:-60}
      BROWSER_ACTION_RETRY_COUNT: ${BROWSER_ACTION_RETRY_COUNT:-2}
      BROWSER_ACTION_RETRY_BACKOFF_SECONDS: ${BROWSER_ACTION_RETRY_BACKOFF_SECONDS:-2}
      SCREENSHOT_RETENTION_DAYS: ${SCREENSHOT_RETENTION_DAYS:-7}
      OPENCLAW_PROVIDER: ${OPENCLAW_PROVIDER:-mock}
      OPENCLAW_ENABLED: ${OPENCLAW_ENABLED:-true}
      OPENCLAW_ACTION_TIMEOUT_SECONDS: ${OPENCLAW_ACTION_TIMEOUT_SECONDS:-60}
      COMFYUI_RUNTIME_PROVIDER: ${COMFYUI_RUNTIME_PROVIDER:-disabled}
      COMFYUI_RUNTIME_ENABLED: ${COMFYUI_RUNTIME_ENABLED:-false}
      COMFYUI_RUNTIME_BASE_URL: ${COMFYUI_RUNTIME_BASE_URL:-http://host.docker.internal:8188}
      COMFYUI_RUNTIME_TIMEOUT_SECONDS: ${COMFYUI_RUNTIME_TIMEOUT_SECONDS:-30}
      COMFYUI_RUNTIME_ALLOW_NETWORK: ${COMFYUI_RUNTIME_ALLOW_NETWORK:-false}
      COMFYUI_RUNTIME_ALLOWED_HOSTS: ${COMFYUI_RUNTIME_ALLOWED_HOSTS:-host.docker.internal,127.0.0.1,localhost}
      COMFYUI_RUNTIME_READ_ONLY_PROBE_ENABLED: ${COMFYUI_RUNTIME_READ_ONLY_PROBE_ENABLED:-false}
      COMFYUI_RUNTIME_HEALTH_PATH: ${COMFYUI_RUNTIME_HEALTH_PATH:-/system_stats}
      COMFYUI_RUNTIME_ALLOWED_HEALTH_PATHS: ${COMFYUI_RUNTIME_ALLOWED_HEALTH_PATHS:-/system_stats}
      COMFYUI_RUNTIME_PROMPT_SUBMISSION_ENABLED: ${COMFYUI_RUNTIME_PROMPT_SUBMISSION_ENABLED:-false}
      COMFYUI_RUNTIME_ALLOWED_EXECUTION_PATHS: ${COMFYUI_RUNTIME_ALLOWED_EXECUTION_PATHS:-/prompt,/history,/queue}
      COMFYUI_VIDEO_MAX_CONCURRENT_JOBS: ${COMFYUI_VIDEO_MAX_CONCURRENT_JOBS:-1}
      COMFYUI_VIDEO_QUEUE_PENDING_LIMIT: ${COMFYUI_VIDEO_QUEUE_PENDING_LIMIT:-2}
      COMFYUI_VIDEO_MIN_FREE_VRAM_MB: ${COMFYUI_VIDEO_MIN_FREE_VRAM_MB:-2048}
      COMFYUI_VIDEO_DEFAULT_VRAM_ESTIMATE_MB: ${COMFYUI_VIDEO_DEFAULT_VRAM_ESTIMATE_MB:-8192}
      COMFYUI_VIDEO_GPU_ENDPOINTS: ${COMFYUI_VIDEO_GPU_ENDPOINTS:-}
      OPERATION_PLANNING_MULTIMODAL_ENABLED: ${OPERATION_PLANNING_MULTIMODAL_ENABLED:-true}
      OPERATION_PLANNING_LLM_MODEL: ${OPERATION_PLANNING_LLM_MODEL:-llama-70b}
      OPERATION_PLANNING_VLM_PROVIDER: ${OPERATION_PLANNING_VLM_PROVIDER:-comfyui_cu130}
      OPERATION_PLANNING_VLM_MODEL: ${OPERATION_PLANNING_VLM_MODEL:-qwen_2.5_vl_7b_fp8_scaled}
      OPERATION_PLANNING_VIDEO_ANALYSIS_ENABLED: ${OPERATION_PLANNING_VIDEO_ANALYSIS_ENABLED:-true}
      OPERATION_PLANNING_IMAGE_GENERATION_PROVIDER: ${OPERATION_PLANNING_IMAGE_GENERATION_PROVIDER:-comfyui_cu130}
      OPERATION_PLANNING_IMAGE_GENERATION_MODEL: ${OPERATION_PLANNING_IMAGE_GENERATION_MODEL:-Qwen-Image-Edit-2511-Q6_K}
      OPERATION_PLANNING_DATA_ANALYSIS_MODEL: ${OPERATION_PLANNING_DATA_ANALYSIS_MODEL:-llama-70b}
      OPERATION_PLANNING_USE_VIDEO_AGENT_WORKFLOWS: ${OPERATION_PLANNING_USE_VIDEO_AGENT_WORKFLOWS:-true}
      CODEX_GLOBAL_CONTROLLER_ENABLED: ${CODEX_GLOBAL_CONTROLLER_ENABLED:-true}
      CODEX_GLOBAL_CONTROLLER_PROVIDER: ${CODEX_GLOBAL_CONTROLLER_PROVIDER:-codex}
      CODEX_GLOBAL_CONTROLLER_MODE: ${CODEX_GLOBAL_CONTROLLER_MODE:-supervise_and_route}
      CODEX_GLOBAL_CONTROLLER_MODEL: ${CODEX_GLOBAL_CONTROLLER_MODEL:-gpt-5-codex}
      CODEX_GLOBAL_CONTROLLER_SCOPE: ${CODEX_GLOBAL_CONTROLLER_SCOPE:-planning,knowledge,video_analysis,image_generation,production,approval,publish,feedback}
      CODEX_GLOBAL_CONTROLLER_REQUIRES_HUMAN_APPROVAL: ${CODEX_GLOBAL_CONTROLLER_REQUIRES_HUMAN_APPROVAL:-true}
      DIGITAL_HUMAN_PROVIDER: ${DIGITAL_HUMAN_PROVIDER:-mock}
      DIGITAL_HUMAN_ENABLED: ${DIGITAL_HUMAN_ENABLED:-false}
      DIGITAL_HUMAN_ALLOW_EXTERNAL_API: ${DIGITAL_HUMAN_ALLOW_EXTERNAL_API:-false}
      DIGITAL_HUMAN_ASSET_DIR: ${DIGITAL_HUMAN_ASSET_DIR:-storage/digital_human_assets}
      DIGITAL_HUMAN_OUTPUT_DIR: ${DIGITAL_HUMAN_OUTPUT_DIR:-storage/digital_human_outputs}
      DIGITAL_HUMAN_DEFAULT_VOICE_ID: ${DIGITAL_HUMAN_DEFAULT_VOICE_ID:-zh-CN-default}
      DIGITAL_HUMAN_DEFAULT_ASPECT_RATIO: ${DIGITAL_HUMAN_DEFAULT_ASPECT_RATIO:-9:16}
      OUTPUT_ARTIFACT_DIR: ${OUTPUT_ARTIFACT_DIR:-storage/output_artifacts}
      OUTPUT_PACKAGE_DIR: ${OUTPUT_PACKAGE_DIR:-storage/output_packages}
      OUTPUT_EXPORT_DIR: ${OUTPUT_EXPORT_DIR:-storage/output_exports}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      reranker-worker:
        condition: service_started
      browser-worker:
        condition: service_started
    volumes:
      - ./app:/app/app
      - ./deployment:/app/deployment:ro
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
      - ./screenshots:/app/screenshots
      - ./storage:/app/storage
      - ./worker/screenshots:/app/worker/screenshots
      - ./worker/profiles:/app/worker/profiles
      - ./worker/profile_backups:/app/worker/profile_backups
    restart: unless-stopped
    networks:
      - aiops-network

  browser-worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-public.ecr.aws/docker/library/python:3.12-slim}
    container_name: aiops-browser-worker
    command: ["uvicorn", "worker.main:app", "--host", "0.0.0.0", "--port", "9100"]
    environment:
      WORKER_HOST: ${WORKER_HOST:-0.0.0.0}
      WORKER_PORT: ${WORKER_PORT:-9100}
      WORKER_TIMEOUT_SECONDS: ${WORKER_TIMEOUT_SECONDS:-30}
      WORKER_HEADLESS: ${WORKER_HEADLESS:-true}
      WORKER_BROWSER_TYPE: ${WORKER_BROWSER_TYPE:-chromium}
      WORKER_SCREENSHOT_DIR: ${WORKER_SCREENSHOT_DIR:-worker/screenshots}
      WORKER_PROFILE_DIR: ${WORKER_PROFILE_DIR:-worker/profiles}
      BROWSER_WORKER_AUTH_ENABLED: ${BROWSER_WORKER_AUTH_ENABLED:-true}
      BROWSER_WORKER_AUTH_STRICT: ${BROWSER_WORKER_AUTH_STRICT:-false}
      BROWSER_WORKER_SECRET: ${BROWSER_WORKER_SECRET:-}
      WORKER_VIEWPORT_WIDTH: ${WORKER_VIEWPORT_WIDTH:-1280}
      WORKER_VIEWPORT_HEIGHT: ${WORKER_VIEWPORT_HEIGHT:-720}
      WORKER_CLIENT_OPENCLAW_ENABLED: ${WORKER_CLIENT_OPENCLAW_ENABLED:-true}
      WORKER_CLIENT_OPENCLAW_PROVIDER: ${WORKER_CLIENT_OPENCLAW_PROVIDER:-mock}
      WORKER_CLIENT_OPENCLAW_BASE_URL: ${WORKER_CLIENT_OPENCLAW_BASE_URL:-}
      WORKER_CLIENT_OPENCLAW_API_KEY: ${WORKER_CLIENT_OPENCLAW_API_KEY:-}
      WORKER_CLIENT_OPENCLAW_TIMEOUT_SECONDS: ${WORKER_CLIENT_OPENCLAW_TIMEOUT_SECONDS:-60}
      WORKER_CLIENT_OPENCLAW_HEALTH_PATH: ${WORKER_CLIENT_OPENCLAW_HEALTH_PATH:-/openclaw/health}
      WORKER_CLIENT_OPENCLAW_CAPABILITIES_PATH: ${WORKER_CLIENT_OPENCLAW_CAPABILITIES_PATH:-/openclaw/capabilities}
      WORKER_CLIENT_OPENCLAW_ACTION_PATH: ${WORKER_CLIENT_OPENCLAW_ACTION_PATH:-/openclaw/actions}
    ports:
      - "${BROWSER_WORKER_PORT:-9100}:9100"
    volumes:
      - ./worker:/app/worker
      - ./worker_client/runtime_state:/app/worker_client/runtime_state
      - ./worker_client/worker_state.json:/app/worker_client/worker_state.json:ro
      - ./worker/profiles:/app/worker/profiles
    restart: unless-stopped
    networks:
      - aiops-network

  reranker-worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-public.ecr.aws/docker/library/python:3.12-slim}
    container_name: aiops-reranker-worker
    command: ["uvicorn", "worker.reranker_worker.main:app", "--host", "0.0.0.0", "--port", "8002"]
    environment:
      RERANKER_RUNTIME_HOST: ${RERANKER_RUNTIME_HOST:-0.0.0.0}
      RERANKER_RUNTIME_PORT: ${RERANKER_RUNTIME_PORT:-8002}
      RERANKER_RUNTIME_PROVIDER: ${RERANKER_RUNTIME_PROVIDER:-local}
      RERANKER_RUNTIME_ENGINE: ${RERANKER_RUNTIME_ENGINE:-ollama_embedding}
      RERANKER_RUNTIME_MODEL: ${RERANKER_RUNTIME_MODEL:-bge-m3-embedding-reranker}
      RERANKER_RUNTIME_EMBEDDING_BASE_URL: ${RERANKER_RUNTIME_EMBEDDING_BASE_URL:-http://host.docker.internal:11434}
      RERANKER_RUNTIME_EMBEDDING_MODEL: ${RERANKER_RUNTIME_EMBEDDING_MODEL:-bge-m3}
      RERANKER_RUNTIME_TIMEOUT_SECONDS: ${RERANKER_RUNTIME_TIMEOUT_SECONDS:-60}
      RERANKER_RUNTIME_MAX_DOCUMENTS: ${RERANKER_RUNTIME_MAX_DOCUMENTS:-64}
      RERANKER_RUNTIME_MAX_DOCUMENT_CHARS: ${RERANKER_RUNTIME_MAX_DOCUMENT_CHARS:-4000}
      RERANKER_RUNTIME_EMBEDDING_CONCURRENCY: ${RERANKER_RUNTIME_EMBEDDING_CONCURRENCY:-4}
    ports:
      - "${RERANKER_RUNTIME_PORT:-8002}:8002"
    restart: unless-stopped
    networks:
      - aiops-network

  postgres:
    image: ${POSTGRES_IMAGE:-public.ecr.aws/docker/library/postgres:16-alpine}
    container_name: aiops-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aiops}
      POSTGRES_USER: ${POSTGRES_USER:-aiops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - aiops-network

  redis:
    image: ${REDIS_IMAGE:-public.ecr.aws/docker/library/redis:7-alpine}
    container_name: aiops-redis
    command: ["sh", "-c", "redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-change_me}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - aiops-network

  qdrant:
    image: ${QDRANT_IMAGE:-ghcr.io/qdrant/qdrant/qdrant:v1.16.3}
    container_name: aiops-qdrant
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-change_me}
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped
    networks:
      - aiops-network

volumes:
  postgres-data:
  redis-data:
  qdrant-data:

networks:
  aiops-network:
    driver: bridge
