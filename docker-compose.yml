services:
  # FastAPI 主服务，负责承载后续 AI Operations System 的业务接口。
  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-public.ecr.aws/docker/library/python:3.12-slim}
    container_name: aiops-api
    environment:
      APP_NAME: ${APP_NAME:-AI Operations System}
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-8000}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-aiops}
      POSTGRES_USER: ${POSTGRES_USER:-aiops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_POOL_SIZE: ${POSTGRES_POOL_SIZE:-5}
      POSTGRES_MAX_OVERFLOW: ${POSTGRES_MAX_OVERFLOW:-10}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-change_me}
      REDIS_QUEUE_NAME: ${REDIS_QUEUE_NAME:-aiops:tasks}
      QDRANT_HOST: ${QDRANT_HOST:-qdrant}
      QDRANT_HTTP_PORT: ${QDRANT_HTTP_PORT:-6333}
      QDRANT_GRPC_PORT: ${QDRANT_GRPC_PORT:-6334}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-change_me}
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
      SCHEDULER_INTERVAL_SECONDS: ${SCHEDULER_INTERVAL_SECONDS:-5}
      SCHEDULER_BATCH_SIZE: ${SCHEDULER_BATCH_SIZE:-20}
      SCHEDULER_RUNNING_TIMEOUT_SECONDS: ${SCHEDULER_RUNNING_TIMEOUT_SECONDS:-300}
      TASK_EXECUTOR_ENABLED: ${TASK_EXECUTOR_ENABLED:-true}
      TASK_EXECUTOR_DEQUEUE_TIMEOUT_SECONDS: ${TASK_EXECUTOR_DEQUEUE_TIMEOUT_SECONDS:-5}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LOCAL_LLM_BASE_URL: ${LOCAL_LLM_BASE_URL:-http://host.docker.internal:11434}
      LOCAL_LLM_MODEL: ${LOCAL_LLM_MODEL:-mistral}
      SERVER_LLM_BASE_URL: ${SERVER_LLM_BASE_URL:-http://host.docker.internal:8001/v1}
      SERVER_LLM_MODEL: ${SERVER_LLM_MODEL:-llama-70b}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-120}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-mock}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-384}
      LOCAL_EMBEDDING_BASE_URL: ${LOCAL_EMBEDDING_BASE_URL:-http://host.docker.internal:11434}
      LOCAL_EMBEDDING_MODEL: ${LOCAL_EMBEDDING_MODEL:-bge-m3}
      QDRANT_COLLECTION_NAME: ${QDRANT_COLLECTION_NAME:-ai_knowledge_base}
      RERANKER_PROVIDER: ${RERANKER_PROVIDER:-mock}
      LOCAL_RERANKER_BASE_URL: ${LOCAL_RERANKER_BASE_URL:-http://host.docker.internal:11434}
      LOCAL_RERANKER_MODEL: ${LOCAL_RERANKER_MODEL:-local-reranker-model}
      RERANK_TOP_N: ${RERANK_TOP_N:-5}
      DEFAULT_SEARCH_MODE: ${DEFAULT_SEARCH_MODE:-hybrid}
      DENSE_TOP_K: ${DENSE_TOP_K:-20}
      KEYWORD_TOP_K: ${KEYWORD_TOP_K:-20}
      FINAL_TOP_K: ${FINAL_TOP_K:-5}
      MAX_UPLOAD_FILE_SIZE_MB: ${MAX_UPLOAD_FILE_SIZE_MB:-20}
      UPLOAD_TEMP_DIR: ${UPLOAD_TEMP_DIR:-/tmp/aiops_uploads}
      ALLOWED_FILE_TYPES: ${ALLOWED_FILE_TYPES:-pdf,docx,txt,md,csv}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      # API 依赖基础设施服务，等待数据库和缓存健康后再启动。
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
    restart: unless-stopped
    networks:
      - aiops-network

  # PostgreSQL 用于存储结构化业务数据。
  postgres:
    image: ${POSTGRES_IMAGE:-public.ecr.aws/docker/library/postgres:16-alpine}
    container_name: aiops-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aiops}
      POSTGRES_USER: ${POSTGRES_USER:-aiops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # 使用 PostgreSQL 官方工具检查数据库是否已经可接受连接。
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - aiops-network

  # Redis 用于缓存、任务状态和后续异步协作场景。
  redis:
    image: ${REDIS_IMAGE:-public.ecr.aws/docker/library/redis:7-alpine}
    container_name: aiops-redis
    command: ["sh", "-c", "redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-change_me}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      # 使用 Redis ping 检查服务存活状态。
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - aiops-network

  # Qdrant 用于向量检索和后续知识库/RAG 能力。
  qdrant:
    image: ${QDRANT_IMAGE:-ghcr.io/qdrant/qdrant/qdrant:v1.16.3}
    container_name: aiops-qdrant
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-change_me}
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped
    networks:
      - aiops-network

volumes:
  # 使用具名卷保存本地开发环境中的持久化数据。
  postgres-data:
  redis-data:
  qdrant-data:

networks:
  # 统一网络让容器之间可以通过服务名互相访问。
  aiops-network:
    driver: bridge
