server_url: http://localhost:8000
worker_name: local-windows-worker-1
worker_type: playwright
workspace_id: demo-workspace
worker_secret: null
worker_base_url: http://localhost:9100
runtime_host: 127.0.0.1
runtime_port: 9100
state_path: worker_client/worker_state.json
heartbeat_interval_seconds: 30
max_sessions: 5
max_actions_per_minute: 60
priority: 100
auth_enabled: true
auth_strict: false
timeout_seconds: 30
screenshot_dir: worker/screenshots
profile_dir: worker/profiles
capabilities:
  browser: chromium
  browser_runtime: true
  screenshot: true
  page_content: true
  persistent_profile: true
  human_control: true
  ui_access_placeholder: true
  openclaw: true
openclaw:
  enabled: true
  provider: mock
allowed_actions:
  - navigate
  - click
  - type_text
  - scroll
  - screenshot
  - get_page_content
allowed_domains:
  - example.com
  - localhost
  - 127.0.0.1
