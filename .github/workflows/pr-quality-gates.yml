name: PR Quality Gates

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-quality:
    name: Python docs and runtime gates
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install LibreOffice for DOCX render QA
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Run pytest
        run: python -m pytest -q

      - name: Verify docs and runtime references
        run: python scripts/verify_docs_runtime.py

      - name: Validate release packaging
        run: python release/scripts/validate_release_packaging.py

      - name: Check runtime hygiene
        run: python scripts/check_runtime_hygiene.py

      - name: Check migration continuity
        run: python scripts/check_migration_continuity.py

      - name: Check required CI gates
        run: python scripts/check_required_ci_gates.py

      - name: Run static release smoke group
        run: python scripts/release_smoke_matrix.py --group static --skip-docker --skip-build --skip-docs

      - name: Generate release readiness report
        run: python scripts/generate_release_report.py --profile server-docker --include-live-checks --output release/reports/ci/release_readiness_report.json

      - name: Upload release readiness report
        uses: actions/upload-artifact@v4
        with:
          name: release-readiness-report
          path: release/reports/ci/release_readiness_report.json
          if-no-files-found: error

  frontend-builds:
    name: Frontend build (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        project:
          - admin_dashboard
          - worker_console
          - worker_console_desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.project }}
        run: npm ci

      - name: Typecheck
        working-directory: ${{ matrix.project }}
        run: npm run typecheck

      - name: Build
        working-directory: ${{ matrix.project }}
        run: npm run build
